<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="100%" height="100%" style="background: #0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <!-- Card Shadow -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fb923c" />
    </marker>
  </defs>

  <!-- Outer Canvas Border -->
  <rect x="12" y="12" width="1176" height="616" rx="16" fill="#0d1117" stroke="#1e293b" stroke-width="1.5" />

  <!-- Header Title -->
  <text x="50" y="52" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="0.1em" text-transform="uppercase">eventsalsa/encryption Architecture</text>
  <text x="50" y="78" fill="#f8fafc" font-size="20" font-weight="700">Two-Tier Key Hierarchy &amp; Decoupled In-Memory Crypto</text>

  <!-- ================= CONNECTORS / FLOW ARROWS ================= -->

  <!-- 1. Postgres <-> postgres.Store (DEK Persistence) -->
  <path d="M 330 185 L 430 185" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-blue)" />
  <rect x="345" y="165" width="70" height="20" rx="4" fill="#0f172a" stroke="#0284c7" stroke-width="1" />
  <text x="380" y="179" fill="#38bdf8" font-size="10" font-weight="600" text-anchor="middle">pgx.Tx / Pool</text>

  <!-- 2. postgres.Store -> envelope.Envelope (Pass Encrypted DEK) -->
  <path d="M 570 240 L 570 310" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)" />
  <rect x="510" y="265" width="120" height="20" rx="4" fill="#0f172a" stroke="#0284c7" stroke-width="1" />
  <text x="570" y="279" fill="#38bdf8" font-size="10" font-weight="600" text-anchor="middle">Encrypted DEK</text>

  <!-- 3. systemkey.Keyring -> envelope.Envelope (Provide KEK in RAM) -->
  <path d="M 870 185 L 750 340" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)" />
  <rect x="760" y="240" width="105" height="20" rx="4" fill="#0f172a" stroke="#d97706" stroke-width="1" />
  <text x="812" y="254" fill="#fbbf24" font-size="10" font-weight="600" text-anchor="middle">Master KEK (RAM)</text>

  <!-- 4. cipher.Cipher <-> envelope.Envelope (AES-256-GCM) -->
  <path d="M 870 445 L 720 395" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow-purple)" />
  <rect x="750" y="420" width="115" height="20" rx="4" fill="#0f172a" stroke="#9333ea" stroke-width="1" />
  <text x="807" y="434" fill="#c084fc" font-size="10" font-weight="600" text-anchor="middle">AES-256-GCM Engine</text>

  <!-- 5. envelope.Envelope -> eventsalsa/store (Persist Ciphertext) -->
  <path d="M 430 400 L 290 440" fill="none" stroke="#fb923c" stroke-width="2" marker-end="url(#arrow-orange)" />
  <rect x="290" y="405" width="120" height="20" rx="4" fill="#0f172a" stroke="#ea580c" stroke-width="1" />
  <text x="350" y="419" fill="#fb923c" font-size="10" font-weight="600" text-anchor="middle">Base64 Ciphertext</text>


  <!-- ================= COMPONENT CARDS ================= -->

  <!-- CARD 1: PostgreSQL (Database) -->
  <g transform="translate(50, 130)" filter="url(#card-shadow)">
    <rect width="280" height="110" rx="12" fill="#0f172a" stroke="#1d4ed8" stroke-width="1.5" />
    <rect x="12" y="-10" width="145" height="22" rx="6" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1" />
    <text x="84" y="5" fill="#93c5fd" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.05em">DATABASE</text>
    
    <!-- Icon: Database -->
    <g transform="translate(20, 30)" stroke="#60a5fa" stroke-width="1.8" fill="none">
      <ellipse cx="14" cy="8" rx="14" ry="6" />
      <path d="M 0 8 v 12 c 0 3.3 6.3 6 14 6 s 14 -2.7 14 -6 v -12" />
      <path d="M 0 20 v 12 c 0 3.3 6.3 6 14 6 s 14 -2.7 14 -6 v -12" />
    </g>
    
    <text x="64" y="48" fill="#f8fafc" font-size="16" font-weight="700">PostgreSQL</text>
    <text x="64" y="68" fill="#94a3b8" font-size="12">infrastructure.encryption_keys</text>
    <text x="64" y="86" fill="#38bdf8" font-size="11" font-weight="600">Stores Encrypted DEKs</text>
  </g>

  <!-- CARD 2: postgres.Store (Stateless Keystore) -->
  <g transform="translate(430, 130)" filter="url(#card-shadow)">
    <rect width="280" height="110" rx="12" fill="#0f172a" stroke="#0e7490" stroke-width="1.5" />
    <rect x="12" y="-10" width="160" height="22" rx="6" fill="#164e63" stroke="#06b6d4" stroke-width="1" />
    <text x="92" y="5" fill="#67e8f9" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.05em">STATELESS KEYSTORE</text>
    
    <!-- Icon: Storage Box -->
    <g transform="translate(20, 30)" stroke="#22d3ee" stroke-width="1.8" fill="none">
      <rect x="2" y="4" width="24" height="16" rx="3" />
      <circle cx="8" cy="12" r="2" fill="#22d3ee" />
      <path d="M 14 12 h 8" />
      <path d="M 2 26 h 24" />
      <circle cx="14" cy="26" r="3" />
    </g>
    
    <text x="64" y="48" fill="#f8fafc" font-size="16" font-weight="700">postgres.Store</text>
    <text x="64" y="68" fill="#94a3b8" font-size="12">CreateKey, RotateKey, GetKey</text>
    <text x="64" y="86" fill="#22d3ee" font-size="11" font-weight="600">Stateless (pgx.Tx / Pool)</text>
  </g>

  <!-- CARD 3: systemkey.Keyring (Master KEKs) -->
  <g transform="translate(870, 130)" filter="url(#card-shadow)">
    <rect width="280" height="110" rx="12" fill="#0f172a" stroke="#b45309" stroke-width="1.5" />
    <rect x="12" y="-10" width="140" height="22" rx="6" fill="#78350f" stroke="#f59e0b" stroke-width="1" />
    <text x="82" y="5" fill="#fde68a" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.05em">MASTER KEYRING</text>
    
    <!-- Icon: Key -->
    <g transform="translate(20, 30)" stroke="#fbbf24" stroke-width="1.8" fill="none">
      <circle cx="10" cy="10" r="7" />
      <circle cx="10" cy="10" r="3" />
      <path d="M 15 15 L 26 26" />
      <path d="M 22 22 L 25 19" />
      <path d="M 24 24 L 27 21" />
    </g>
    
    <text x="64" y="48" fill="#f8fafc" font-size="16" font-weight="700">systemkey.Keyring</text>
    <text x="64" y="68" fill="#94a3b8" font-size="12">Master System Keys (KEKs)</text>
    <text x="64" y="86" fill="#fbbf24" font-size="11" font-weight="600">Loaded in RAM (Vault / Files)</text>
  </g>

  <!-- CARD 4: envelope.Envelope (In-Memory Engine) -->
  <g transform="translate(430, 310)" filter="url(#card-shadow)">
    <rect width="290" height="135" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="2" fill-opacity="0.35" />
    <rect x="12" y="-10" width="180" height="22" rx="6" fill="#065f46" stroke="#34d399" stroke-width="1" />
    <text x="102" y="5" fill="#a7f3d0" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.05em">IN-MEMORY CRYPTO ENGINE</text>
    
    <!-- Icon: Shield & CPU -->
    <g transform="translate(20, 35)" stroke="#34d399" stroke-width="1.8" fill="none">
      <path d="M 14 2 L 4 6 v 8 c 0 8 10 14 10 14 s 10 -6 10 -14 V 6 Z" />
      <path d="M 10 14 l 3 3 6 -6" />
    </g>
    
    <text x="64" y="50" fill="#f8fafc" font-size="17" font-weight="700">envelope.Envelope</text>
    <text x="64" y="72" fill="#e2e8f0" font-size="12">Unwraps DEK &amp; Encrypts in RAM</text>
    <text x="64" y="92" fill="#94a3b8" font-size="11">Zero DB or Context Dependencies</text>
    <text x="64" y="112" fill="#34d399" font-size="11" font-weight="600">✓ Auto Memory Scrubbing (ZeroBytes)</text>
  </g>

  <!-- CARD 5: cipher.Cipher (Symmetric Engine) -->
  <g transform="translate(870, 390)" filter="url(#card-shadow)">
    <rect width="280" height="110" rx="12" fill="#0f172a" stroke="#7e22ce" stroke-width="1.5" />
    <rect x="12" y="-10" width="155" height="22" rx="6" fill="#581c87" stroke="#a855f7" stroke-width="1" />
    <text x="89" y="5" fill="#e9d5ff" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.05em">SYMMETRIC CIPHER</text>
    
    <!-- Icon: Lock & Cipher -->
    <g transform="translate(20, 30)" stroke="#c084fc" stroke-width="1.8" fill="none">
      <rect x="4" y="10" width="20" height="16" rx="3" />
      <path d="M 8 10 V 6 a 6 6 0 0 1 12 0 v 4" />
      <circle cx="14" cy="18" r="2" fill="#c084fc" />
    </g>
    
    <text x="64" y="48" fill="#f8fafc" font-size="16" font-weight="700">cipher.Cipher</text>
    <text x="64" y="68" fill="#94a3b8" font-size="12">cipher/aesgcm (AES-256-GCM)</text>
    <text x="64" y="86" fill="#c084fc" font-size="11" font-weight="600">Pluggable Symmetric Crypto</text>
  </g>

  <!-- CARD 6: eventsalsa/store (Event Store) -->
  <g transform="translate(50, 390)" filter="url(#card-shadow)">
    <rect width="280" height="110" rx="12" fill="#0f172a" stroke="#c2410c" stroke-width="1.5" />
    <rect x="12" y="-10" width="130" height="22" rx="6" fill="#7c2d12" stroke="#f97316" stroke-width="1" />
    <text x="77" y="5" fill="#fed7aa" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.05em">EVENT STORE</text>
    
    <!-- Icon: Event Log Stream -->
    <g transform="translate(20, 30)" stroke="#fb923c" stroke-width="1.8" fill="none">
      <path d="M 4 6 h 20 M 4 12 h 14 M 4 18 h 18 M 4 24 h 12" />
      <circle cx="24" cy="12" r="2" fill="#fb923c" />
      <circle cx="22" cy="24" r="2" fill="#fb923c" />
    </g>
    
    <text x="64" y="48" fill="#f8fafc" font-size="16" font-weight="700">eventsalsa/store</text>
    <text x="64" y="68" fill="#94a3b8" font-size="12">Append-Only Event Streams</text>
    <text x="64" y="86" fill="#fb923c" font-size="11" font-weight="600">Holds Encrypted Payloads</text>
  </g>
</svg>
